name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seasons_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements/dev.txt
      - name: Alembic migrate cycle (Postgres)
        env:
          APP_ENV: development
          DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/seasons_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest tests/ -v
      - name: Coverage gate (analytics + base_metrics)
        run: |
          pip install pytest-cov
          pytest tests/test_base_metrics_rest.py tests/test_base_metrics_perf.py \
            --cov=src.services.analytics --cov=src.services.base_metrics \
            --cov-fail-under=70 -q
